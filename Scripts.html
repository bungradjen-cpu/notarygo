<script>
/**
 * NOTARYGO™ — Notary Office Operational Control System
 * Client-Side Application Controller & RPC Manager
 */

var App = (function() {
  var state = {
    currentUser: null,
    office: null,
    serviceTypes: [],
    staffList: [],
    organizations: [],
    currentView: 'dashboard',
    viewParams: {},
    mattersList: [],
    activeMatterId: null,
    activeMatterDetail: null
  };

  /**
   * Application Initialization
   */
  function init() {
    var savedSession = null;
    try {
      var raw = localStorage.getItem('NOTARYGO_AUTH_USER');
      if (raw) savedSession = JSON.parse(raw);
    } catch (e) {}

    if (!savedSession || !savedSession.email) {
      // User not logged in: display Login screen
      document.getElementById('view-login').style.display = 'flex';
      document.getElementById('app-workspace').style.display = 'none';
      
      // Fetch public office branding for login header
      callServer('apiGetInitialState', [''], function(res) {
        if (res.success && res.data.office) {
          state.office = res.data.office;
          document.getElementById('login-office-name').innerText = state.office.officeName || 'NOTARYGO™';
        }
      });
      return;
    }

    showLoading('Menghubungkan ke NOTARYGO™...');
    callServer('apiGetInitialState', [savedSession.email], function(res) {
      hideLoading();
      if (!res.success || !res.data.currentUser) {
        // Invalid session or deactivated
        localStorage.removeItem('NOTARYGO_AUTH_USER');
        document.getElementById('view-login').style.display = 'flex';
        document.getElementById('app-workspace').style.display = 'none';
        showToast(res.message || 'Sesi login telah berakhir. Silakan login kembali.', 'warning');
        return;
      }

      var data = res.data;
      state.currentUser = data.currentUser;
      state.office = data.office;
      state.serviceTypes = data.serviceTypes || [];
      state.staffList = data.staffList || [];
      state.organizations = data.organizations || [];

      // Switch view from Login to Workspace
      document.getElementById('view-login').style.display = 'none';
      document.getElementById('app-workspace').style.display = 'flex';

      // Update UI Branding
      if (state.office) {
        document.getElementById('brand-office-name').innerText = state.office.officeName || 'NOTARYGO™';
        document.getElementById('brand-notary-name').innerText = state.office.notaryName || 'Notary Control';
        document.getElementById('nav-office-title').innerHTML = '<strong>' + (state.office.officeName || 'KANTOR NOTARIS & PPAT').toUpperCase() + '</strong>';
      }

      // Update Current User in Sidebar
      if (state.currentUser) {
        document.getElementById('sidebar-user-name').innerText = state.currentUser.name || state.currentUser.email;
        document.getElementById('sidebar-user-role').innerText = state.currentUser.role;
        document.getElementById('sidebar-user-avatar').innerText = (state.currentUser.name || 'U').charAt(0).toUpperCase();
      }

      // Update Alert Badges
      if (data.alertCount > 0) {
        var ab = document.getElementById('nav-badge-attention');
        ab.innerText = data.alertCount;
        ab.style.display = 'inline-block';
      }

      populateGlobalDropdowns();
      navigateTo('dashboard');
    }, function(err) {
      hideLoading();
      showToast('Terjadi kesalahan koneksi server: ' + err, 'error');
    });
  }

  /**
   * Login Form Submission Handler
   */
  function submitLogin(e) {
    e.preventDefault();
    var email = document.getElementById('login-email').value;
    var password = document.getElementById('login-password').value;

    showLoading('Memverifikasi kredensial akun...');
    callServer('apiLogin', [email, password], function(res) {
      hideLoading();
      if (res.success && res.data) {
        localStorage.setItem('NOTARYGO_AUTH_USER', JSON.stringify(res.data));
        state.currentUser = res.data;
        showToast('Selamat datang, ' + res.data.name + '!', 'success');
        init();
      } else {
        showToast(res.message || 'Email atau password salah.', 'error');
      }
    }, function(err) {
      hideLoading();
      showToast('Login gagal: ' + err, 'error');
    });
  }

  /**
   * User Logout Handler
   */
  function logout() {
    if (!confirm('Apakah Anda yakin ingin keluar dari sesi akun ini?')) return;
    localStorage.removeItem('NOTARYGO_AUTH_USER');
    state.currentUser = null;
    document.getElementById('login-password').value = '';
    document.getElementById('app-workspace').style.display = 'none';
    document.getElementById('view-login').style.display = 'flex';
    showToast('Anda telah keluar dari sistem NOTARYGO™.', 'info');
  }

  /**
   * Navigation & Router
   */
  function navigateTo(viewName, params) {
    state.currentView = viewName;
    state.viewParams = params || {};

    // Update Sidebar Active state
    var navItems = document.querySelectorAll('.app-sidebar .nav-item');
    navItems.forEach(function(el) { el.classList.remove('active'); });

    var targetViews = document.querySelectorAll('.view-container');
    targetViews.forEach(function(v) { v.classList.remove('active'); });

    var activeView = document.getElementById('view-' + viewName);
    if (activeView) {
      activeView.classList.add('active');
    }

    // Close mobile sidebar if open
    document.getElementById('app-sidebar').classList.remove('open');

    // Trigger View Loaders
    if (viewName === 'dashboard') loadDashboard();
    else if (viewName === 'my-work') loadMyWork();
    else if (viewName === 'attention') loadAttentionRequired();
    else if (viewName === 'matters') loadMatters(params);
    else if (viewName === 'matter-detail') loadMatterDetail(params.matterId);
    else if (viewName === 'clients') loadClients();
    else if (viewName === 'organizations') loadOrganizations();
    else if (viewName === 'tasks') loadTasks();
    else if (viewName === 'signing') loadSignings();
    else if (viewName === 'invoices') loadInvoices();
    else if (viewName === 'reports') loadReports();
    else if (viewName === 'audit') loadAuditLogs();
    else if (viewName === 'settings') loadSettings();
  }

  function refreshCurrentView() {
    navigateTo(state.currentView, state.viewParams);
  }

  function toggleSidebar() {
    document.getElementById('app-sidebar').classList.toggle('open');
  }

  /**
   * Server RPC Communication Bridge
   */
  function callServer(functionName, args, onSuccess, onError) {
    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      console.warn('Google Script Runner is not available in mock/test browser mode.');
      if (onError) onError('Google Script Runner tidak tersedia.');
      return;
    }

    var runner = google.script.run
      .withSuccessHandler(function(response) {
        if (onSuccess) onSuccess(response);
      })
      .withFailureHandler(function(error) {
        console.error('RPC Error on ' + functionName + ':', error);
        if (onError) onError(error.message || String(error));
        else showToast('Kesalahan server: ' + (error.message || error), 'error');
      });

    runner[functionName].apply(runner, args || []);
  }

  /**
   * Modal Management
   */
  function openModal(modalId) {
    var modal = document.getElementById(modalId);
    if (modal) modal.classList.add('active');
  }

  function closeModal(modalId) {
    var modal = document.getElementById(modalId);
    if (modal) modal.classList.remove('active');
  }

  /**
   * Toast Notifications
   */
  function showToast(message, type) {
    var container = document.getElementById('toast-container');
    var toast = document.createElement('div');
    toast.className = 'toast ' + (type || 'info');
    toast.innerHTML = '<div style="flex:1; font-size:13px; font-weight:500;">' + message + '</div>';
    container.appendChild(toast);

    setTimeout(function() {
      toast.style.opacity = '0';
      toast.style.transform = 'translateY(10px)';
      toast.style.transition = 'all 0.3s ease';
      setTimeout(function() { toast.remove(); }, 300);
    }, 4000);
  }

  function showLoading(msg) {
    document.getElementById('loading-message').innerText = msg || 'Memuat...';
    document.getElementById('loading-overlay').classList.add('active');
  }

  function hideLoading() {
    document.getElementById('loading-overlay').classList.remove('active');
  }

  /**
   * Populate Global Form Dropdowns
   */
  function populateGlobalDropdowns() {
    // Clients dropdown
    var clientSelect = document.getElementById('nm-client-id');
    if (clientSelect) {
      callServer('apiGetClients', [], function(res) {
        if (res.success && res.data) {
          clientSelect.innerHTML = '<option value="">-- Pilih Klien --</option>' +
            res.data.map(function(c){ return '<option value="' + c.clientId + '">' + c.name + ' (' + (c.phone || '-') + ')</option>'; }).join('');
        }
      });
    }

    // Service Types dropdowns
    var serviceOptions = '<option value="">-- Pilih Jenis Layanan --</option>' +
      state.serviceTypes.map(function(s){ return '<option value="' + s.serviceTypeId + '">' + s.name + '</option>'; }).join('');
    
    var nmService = document.getElementById('nm-service-type-id');
    if (nmService) nmService.innerHTML = serviceOptions;
    var niService = document.getElementById('ni-service');
    if (niService) niService.innerHTML = serviceOptions;
    var filterService = document.getElementById('filter-matters-service');
    if (filterService) filterService.innerHTML = '<option value="">Semua Layanan</option>' + state.serviceTypes.map(function(s){ return '<option value="' + s.serviceTypeId + '">' + s.name + '</option>'; }).join('');

    // PIC / Staff dropdowns
    var staffOptions = '<option value="">-- Pilih Staf PIC --</option>' +
      state.staffList.map(function(st){ return '<option value="' + st.email + '">' + st.name + ' (' + st.role + ')</option>'; }).join('');
    
    var nmPic = document.getElementById('nm-pic');
    if (nmPic) nmPic.innerHTML = staffOptions;
    var atAssigned = document.getElementById('at-assigned-to');
    if (atAssigned) atAssigned.innerHTML = staffOptions;
    var hoFrom = document.getElementById('ho-from-email');
    if (hoFrom) hoFrom.innerHTML = staffOptions;
    var hoTo = document.getElementById('ho-to-email');
    if (hoTo) hoTo.innerHTML = staffOptions;
    var filterPic = document.getElementById('filter-matters-pic');
    if (filterPic) filterPic.innerHTML = '<option value="">Semua PIC</option>' + state.staffList.map(function(st){ return '<option value="' + st.email + '">' + st.name + '</option>'; }).join('');

    // Organizations dropdown
    var orgOptions = '<option value="">-- Tanpa Rekanan --</option>' +
      state.organizations.map(function(o){ return '<option value="' + o.organizationId + '">' + o.name + ' (' + o.type + ')</option>'; }).join('');
    var nmOrg = document.getElementById('nm-org-id');
    if (nmOrg) nmOrg.innerHTML = orgOptions;
  }

  // ==========================================
  // VIEW LOADERS
  // ==========================================

  function loadDashboard() {
    showLoading('Memuat Dashboard...');
    callServer('apiGetDashboardData', [], function(res) {
      hideLoading();
      if (!res.success) return showToast(res.message, 'error');

      var data = res.data;
      var kpi = data.kpi;
      document.getElementById('kpi-active-matters').innerText = kpi.active;
      document.getElementById('kpi-overdue-matters').innerText = kpi.overdue;
      document.getElementById('kpi-pending-matters').innerText = kpi.pending;
      document.getElementById('kpi-deadlines-today').innerText = kpi.deadlinesToday;
      document.getElementById('kpi-signing-today').innerText = kpi.todaySignings;
      document.getElementById('kpi-no-pic').innerText = kpi.noPic;
      document.getElementById('kpi-outstanding').innerText = formatRupiah(kpi.outstandingTotal);

      // Critical alerts banner
      var alertContainer = document.getElementById('dashboard-critical-alerts-list');
      var alerts = data.alerts.critical || [];
      if (alerts.length > 0) {
        var html = '<ul style="margin: 0; padding-left: 20px; color: #991b1b; font-size: 13px;">';
        for (var a = 0; a < alerts.length; a++) {
          var alt = alerts[a];
          html += '<li style="margin-bottom: 6px;"><strong>' + (alt.matterNumber || alt.entityType) + ':</strong> ' + alt.reason + ' <button class="btn btn-secondary btn-sm" style="padding: 2px 6px; font-size: 10px; margin-left: 6px;" onclick="App.navigateTo(\'matter-detail\', { matterId: \'' + alt.entityId + '\' })">Buka Perkara →</button></li>';
        }
        html += '</ul>';
        alertContainer.innerHTML = html;
      } else {
        alertContainer.innerHTML = '<p style="color: #15803d; font-size: 13px; font-weight: 500;">✓ Tidak ada alert kritis saat ini. Seluruh berkas berjalan normal.</p>';
      }

      // Recent Matters Table
      var tbody = document.getElementById('dashboard-recent-matters-tbody');
      var matters = data.recentMatters || [];
      if (matters.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; color:#94a3b8; padding:24px;">Belum ada perkara terdaftar. Buat perkara baru sekarang.</td></tr>';
      } else {
        tbody.innerHTML = matters.map(function(m) {
          return '<tr>' +
            '<td><strong>' + m.matterNumber + '</strong></td>' +
            '<td>' + m.clientNameSnapshot + '</td>' +
            '<td>' + m.serviceTypeNameSnapshot + '</td>' +
            '<td>' + m.title + '</td>' +
            '<td>' + (m.assignedPIC || '<span style="color:#ef4444; font-weight:bold;">BELUM ADA PIC</span>') + '</td>' +
            '<td><span class="badge badge-active">' + m.currentWorkflowStep + '</span></td>' +
            '<td>' + (m.deadline || '-') + '</td>' +
            '<td>' + renderStatusBadge(m.matterStatus) + '</td>' +
            '<td style="text-align:right;"><button class="btn btn-secondary btn-sm" onclick="App.navigateTo(\'matter-detail\', { matterId: \'' + m.matterId + '\' })">Detail →</button></td>' +
            '</tr>';
        }).join('');
      }
    });
  }

  function loadMyWork() {
    showLoading('Memuat My Work...');
    callServer('apiGetMyWork', [state.currentUser ? state.currentUser.email : ''], function(res) {
      hideLoading();
      if (!res.success) return showToast(res.message, 'error');

      var data = res.data;
      document.getElementById('mywork-kpi-tasks').innerText = data.summary.totalTasks;
      document.getElementById('mywork-kpi-overdue').innerText = data.summary.overdueTasks;
      document.getElementById('mywork-kpi-matters').innerText = data.summary.activeMatters;
      document.getElementById('mywork-kpi-followups').innerText = data.summary.dueFollowUps;
      document.getElementById('mywork-kpi-signings').innerText = data.summary.upcomingSignings;

      // Update navbar badge
      var nb = document.getElementById('nav-badge-mywork');
      if (data.summary.totalTasks > 0) {
        nb.innerText = data.summary.totalTasks;
        nb.style.display = 'inline-block';
      } else {
        nb.style.display = 'none';
      }

      // Tasks Table
      var tTbody = document.getElementById('mywork-tasks-tbody');
      var tasks = data.tasks || [];
      if (tasks.length === 0) {
        tTbody.innerHTML = '<tr><td colspan="8" style="text-align:center; color:#15803d; padding:24px; font-weight:500;">✓ Tidak ada tugas tertunda untuk Anda hari ini.</td></tr>';
      } else {
        tTbody.innerHTML = tasks.map(function(t) {
          var isOverdue = t.deadline && t.deadline < getTodayIso();
          return '<tr style="' + (isOverdue ? 'background-color: #fef2f2;' : '') + '">' +
            '<td><strong>' + t.taskNumber + '</strong></td>' +
            '<td><strong>' + t.title + '</strong>' + (t.description ? '<br><small style="color:#64748b;">' + t.description + '</small>' : '') + '</td>' +
            '<td>' + t.matterId + '</td>' +
            '<td><span class="badge ' + (t.priority === 'CRITICAL' ? 'badge-critical' : (t.priority === 'HIGH' ? 'badge-warning' : 'badge-safe')) + '">' + t.priority + '</span></td>' +
            '<td>' + (t.deadline ? '<span style="' + (isOverdue ? 'color:#dc2626; font-weight:bold;' : '') + '">' + t.deadline + '</span>' : '-') + '</td>' +
            '<td>' + t.progress + '%</td>' +
            '<td><span class="badge badge-active">' + t.status + '</span></td>' +
            '<td style="text-align:right;"><button class="btn btn-gold btn-sm" onclick="App.quickCompleteTask(\'' + t.taskId + '\')">✓ Selesai</button></td>' +
            '</tr>';
        }).join('');
      }

      // Matters Table
      var mTbody = document.getElementById('mywork-matters-tbody');
      var matters = data.matters || [];
      if (matters.length === 0) {
        mTbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:#94a3b8; padding:20px;">Belum ada perkara yang ditugaskan kepada Anda.</td></tr>';
      } else {
        mTbody.innerHTML = matters.map(function(m) {
          return '<tr>' +
            '<td><strong>' + m.matterNumber + '</strong></td>' +
            '<td>' + m.clientNameSnapshot + '</td>' +
            '<td>' + m.title + '</td>' +
            '<td><span class="badge badge-active">' + m.currentWorkflowStep + '</span></td>' +
            '<td>' + (m.nextAction || '-') + '</td>' +
            '<td>' + (m.deadline || '-') + '</td>' +
            '<td style="text-align:right;"><button class="btn btn-secondary btn-sm" onclick="App.navigateTo(\'matter-detail\', { matterId: \'' + m.matterId + '\' })">Buka →</button></td>' +
            '</tr>';
        }).join('');
      }
    });
  }

  function loadAttentionRequired() {
    showLoading('Memindai Exception...');
    callServer('apiGetAttentionRequired', [], function(res) {
      hideLoading();
      if (!res.success) return showToast(res.message, 'error');

      var data = res.data;
      var crit = data.critical || [];
      var warn = data.warning || [];
      var watch = data.watch || [];

      document.getElementById('badge-critical-count').innerText = crit.length + ' Isu';
      document.getElementById('badge-warning-count').innerText = warn.length + ' Isu';
      document.getElementById('badge-watch-count').innerText = watch.length + ' Isu';

      function renderAlertCards(list, containerId, badgeClass) {
        var el = document.getElementById(containerId);
        if (list.length === 0) {
          el.innerHTML = '<p style="color:#64748b; font-size:13px;">Tidak ada alert pada kategori ini.</p>';
        } else {
          el.innerHTML = list.map(function(a) {
            return '<div style="padding: 12px; border: 1px solid #e2e8f0; border-radius: 6px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; background:#ffffff;">' +
              '<div>' +
              '<strong style="color:#0f172a; font-size:13px;">' + (a.matterNumber || a.entityType) + '</strong> - ' + (a.clientName ? a.clientName + ' (' + a.title + ')' : '') + '<br>' +
              '<span style="font-size:12px; color:#475569;">' + a.reason + '</span>' +
              '</div>' +
              '<div>' +
              (a.entityType === 'MATTER' || a.entityType === 'PENDING' || a.entityType === 'SIGNING' ? '<button class="btn btn-secondary btn-sm" onclick="App.navigateTo(\'matter-detail\', { matterId: \'' + (a.matterId || a.entityId) + '\' })">Buka Perkara →</button>' : '') +
              '</div>' +
              '</div>';
          }).join('');
        }
      }

      renderAlertCards(crit, 'attention-critical-container', 'badge-critical');
      renderAlertCards(warn, 'attention-warning-container', 'badge-warning');
      renderAlertCards(watch, 'attention-watch-container', 'badge-watch');
    });
  }

  function loadMatters(filter) {
    showLoading('Memuat Register Perkara...');
    callServer('apiGetMatters', [filter || {}], function(res) {
      hideLoading();
      if (!res.success) return showToast(res.message, 'error');

      state.mattersList = res.data || [];
      var tbody = document.getElementById('matters-table-tbody');

      if (state.mattersList.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; color:#94a3b8; padding:30px;">Tidak ada perkara yang cocok dengan filter pencarian.</td></tr>';
      } else {
        tbody.innerHTML = state.mattersList.map(function(m) {
          return '<tr>' +
            '<td><strong>' + m.matterNumber + '</strong></td>' +
            '<td>' + m.clientNameSnapshot + '</td>' +
            '<td>' + m.serviceTypeNameSnapshot + '</td>' +
            '<td>' + m.title + '</td>' +
            '<td>' + (m.assignedPIC || '<span style="color:#ef4444; font-weight:bold;">BELUM ADA PIC</span>') + '</td>' +
            '<td><span class="badge badge-active">' + m.currentWorkflowStep + '</span></td>' +
            '<td>' + (m.deadline || '-') + '</td>' +
            '<td>' + renderStatusBadge(m.matterStatus) + '</td>' +
            '<td style="text-align:right;">' +
            '<button class="btn btn-secondary btn-sm" onclick="App.navigateTo(\'matter-detail\', { matterId: \'' + m.matterId + '\' })">Buka →</button>' +
            '</td>' +
            '</tr>';
        }).join('');
      }
    });
  }

  function onMattersFilterChange() {
    var search = document.getElementById('filter-matters-search').value;
    var status = document.getElementById('filter-matters-status').value;
    var service = document.getElementById('filter-matters-service').value;
    var pic = document.getElementById('filter-matters-pic').value;

    loadMatters({
      searchQuery: search,
      status: status,
      serviceTypeId: service,
      assignedPIC: pic,
      includeCancelled: status === 'CANCELLED',
      includeArchived: status === 'ARCHIVED'
    });
  }

  function loadMatterDetail(matterId) {
    if (!matterId) return navigateTo('matters');
    state.activeMatterId = matterId;
    showLoading('Memuat Detail Perkara...');

    callServer('apiGetMatterDetail', [matterId], function(res) {
      hideLoading();
      if (!res.success) {
        showToast(res.message, 'error');
        return navigateTo('matters');
      }

      var data = res.data;
      state.activeMatterDetail = data;
      var m = data.matter;

      document.getElementById('md-title').innerText = m.title;
      document.getElementById('md-sub').innerText = 'No. Perkara: ' + m.matterNumber + ' | Klien: ' + m.clientNameSnapshot + ' | Layanan: ' + m.serviceTypeNameSnapshot;
      document.getElementById('md-status-badge').className = 'badge ' + getBadgeClassForStatus(m.matterStatus);
      document.getElementById('md-status-badge').innerText = m.matterStatus;

      // Action bar buttons
      var actionsBar = document.getElementById('md-actions-bar');
      actionsBar.innerHTML = '';
      if (m.matterStatus === 'ACTIVE' || m.matterStatus === 'PENDING') {
        actionsBar.innerHTML += '<button class="btn btn-secondary btn-sm" onclick="App.openSetPendingModal()">⏸ Set Pending</button>';
        actionsBar.innerHTML += '<button class="btn btn-danger btn-sm" onclick="App.openCancelMatterModal()">✕ Batalkan Perkara</button>';
      } else if (m.matterStatus === 'CANCELLED' || m.matterStatus === 'ARCHIVED') {
        actionsBar.innerHTML += '<button class="btn btn-gold btn-sm" onclick="App.restoreMatter(\'' + m.matterId + '\')">↺ Pulihkan ke AKTIF</button>';
      }

      // Workflow Timeline
      renderWorkflowTimeline(data.workflowHistory, m.currentWorkflowStep);

      // Operational Info
      document.getElementById('md-info-pic').innerText = m.assignedPIC || 'Belum Ditugaskan';
      document.getElementById('md-info-spv').innerText = m.supervisor || '-';
      document.getElementById('md-info-deadline').innerText = m.deadline ? m.deadline + ' (' + data.deadlineRisk + ')' : '-';
      document.getElementById('md-info-priority').innerText = m.priority;
      document.getElementById('md-info-pending').innerText = m.pendingStatus === 'PENDING' ? m.pendingReason : 'Tidak Pending';
      document.getElementById('md-info-nextaction').innerText = m.nextAction || '-';

      // Checklist Table
      var chkStats = data.checklistStats;
      document.getElementById('md-checklist-percent-badge').innerText = chkStats.percentage + '% Lengkap (' + chkStats.verifiedCount + '/' + chkStats.requiredTotal + ')';
      var chkTbody = document.getElementById('md-checklist-tbody');
      var chkItems = data.checklistItems || [];
      if (chkItems.length === 0) {
        chkTbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#94a3b8; padding:16px;">Belum ada syarat berkas.</td></tr>';
      } else {
        chkTbody.innerHTML = chkItems.map(function(it) {
          return '<tr>' +
            '<td><strong>' + it.documentType + '</strong>' + (it.required ? ' <span style="color:#ef4444;">*</span>' : '') + '</td>' +
            '<td>' + renderStatusBadge(it.status) + '</td>' +
            '<td>' + (it.receivedDate || '-') + '</td>' +
            '<td>' + (it.verifiedBy || '-') + '</td>' +
            '<td>' + (it.note || '-') + '</td>' +

  function renderWorkflowTimeline(history, currentStep) {
    var defaultSteps = [
      'INCOMING', 'DOCUMENT_CHECKING', 'WAITING_DOCUMENT', 'DRAFTING',
      'INTERNAL_REVIEW', 'NOTARY_APPROVAL', 'CLIENT_APPROVAL', 'SIGNING', 'PROCESSING', 'COMPLETED'
    ];

    var container = document.getElementById('md-workflow-timeline');
    var currentIndex = defaultSteps.indexOf(currentStep);

    container.innerHTML = defaultSteps.map(function(st, idx) {
      var isPassed = currentIndex !== -1 && idx < currentIndex;
      var isCurrent = st === currentStep;
      var bg = isCurrent ? '#0f172a' : (isPassed ? '#10b981' : '#e2e8f0');
      var fg = isCurrent || isPassed ? '#ffffff' : '#64748b';

      return '<div style="flex: 1; min-width: 110px; text-align: center; padding: 8px; border-radius: 6px; background: ' + bg + '; color: ' + fg + '; font-size: 11px; font-weight: 600;">' +
        '<div>' + (idx + 1) + '. ' + st.replace(/_/g, ' ') + '</div>' +
        '</div>';
    }).join('');
  }

  function submitNewMatter(e) {
    e.preventDefault();
    var payload = {
      clientId: document.getElementById('nm-client-id').value,
      serviceTypeId: document.getElementById('nm-service-type-id').value,
      title: document.getElementById('nm-title').value,
      assignedPIC: document.getElementById('nm-pic').value,
      priority: document.getElementById('nm-priority').value,
      organizationId: document.getElementById('nm-org-id').value,
      deadline: document.getElementById('nm-deadline').value,
      description: document.getElementById('nm-description').value
    };

    showLoading('Membuat perkara baru...');
    callServer('apiCreateMatter', [payload], function(res) {
      hideLoading();
      if (res.success) {
        closeModal('modal-new-matter');
        showToast('Perkara ' + res.data.matterNumber + ' berhasil dibuat!', 'success');
        navigateTo('matter-detail', { matterId: res.data.matterId });
      } else {
        showToast(res.message, 'error');
      }
    });
  }

  function openTransitionWorkflowModal() {
    var detail = state.activeMatterDetail;
    if (!detail) return;
    var current = detail.matter.currentWorkflowStep;

    var steps = [
      'INCOMING', 'DOCUMENT_CHECKING', 'WAITING_DOCUMENT', 'DRAFTING',
      'INTERNAL_REVIEW', 'NOTARY_APPROVAL', 'CLIENT_APPROVAL', 'SIGNING', 'PROCESSING', 'COMPLETED'
    ];

    var sel = document.getElementById('tw-target-step');
    sel.innerHTML = steps.map(function(s) {
      return '<option value="' + s + '" ' + (s === current ? 'disabled' : '') + '>' + s + '</option>';
    }).join('');

    openModal('modal-transition-workflow');
  }

  function submitTransitionWorkflow(e) {
    e.preventDefault();
    var targetStep = document.getElementById('tw-target-step').value;
    var note = document.getElementById('tw-note').value;
    var isOverride = document.getElementById('tw-is-override').checked;
    var overrideReason = document.getElementById('tw-override-reason').value;

    showLoading('Menyimpan transisi tahapan...');
    callServer('apiTransitionWorkflow', [state.activeMatterId, targetStep, note, isOverride, overrideReason], function(res) {
      hideLoading();
      if (res.success) {
        closeModal('modal-transition-workflow');
        showToast('Tahapan alur kerja berhasil diperbarui ke: ' + targetStep, 'success');
        loadMatterDetail(state.activeMatterId);
      } else {
        showToast(res.message, 'error');
      }
    });
  }

  function restoreMatter(matterId) {
    if (!confirm('Apakah Anda yakin ingin memulihkan perkara ini kembali ke status AKTIF?')) return;
    showLoading('Memulihkan perkara...');
    callServer('apiRestoreMatter', [matterId, 'Dipulihkan oleh pengguna'], function(res) {

  // ==========================================
  // FORMATTING HELPERS
  // ==========================================

  function formatRupiah(num) {
    var val = Math.round(Number(num) || 0);
    return 'Rp ' + val.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }

  function getTodayIso() {
    var d = new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }

  function getBadgeClassForStatus(status) {
    if (status === 'COMPLETED' || status === 'VERIFIED' || status === 'PAID' || status === 'READY') return 'badge-safe';
    if (status === 'ACTIVE' || status === 'ISSUED' || status === 'SCHEDULED') return 'badge-active';
    if (status === 'PENDING' || status === 'WATCH' || status === 'WAITING') return 'badge-watch';
    if (status === 'WARNING' || status === 'NEED_REVISION' || status === 'PARTIAL') return 'badge-warning';
    if (status === 'CANCELLED' || status === 'CRITICAL' || status === 'OVERDUE' || status === 'NOT_READY') return 'badge-critical';
    if (status === 'ARCHIVED') return 'badge-archived';
    return 'badge-active';
  }

  function renderStatusBadge(status) {
    return '<span class="badge ' + getBadgeClassForStatus(status) + '">' + (status || '-') + '</span>';
  }

  // Public Interface
  
  // -- NEW HANDLERS FOR EDIT, DELETE AND RESET --
  function confirmDelete(type, id, msg) {
    document.getElementById('delete-confirm-type').value = type;
    document.getElementById('delete-confirm-id').value = id;
    document.getElementById('delete-confirm-msg').innerText = msg || 'Apakah Anda yakin ingin menghapus data ini secara permanen?';
    openModal('modal-delete-confirm');
  }

  function executeDelete() {
    var type = document.getElementById('delete-confirm-type').value;
    var id = document.getElementById('delete-confirm-id').value;
    closeModal('modal-delete-confirm');
    showLoading('Menghapus...');
    
    var endpoint = '';
    if(type === 'CLIENT') endpoint = 'apiDeleteClient';
    if(type === 'ORG') endpoint = 'apiDeleteOrganization';
    if(type === 'MATTER') endpoint = 'apiDeleteMatter';
    if(type === 'TASK') endpoint = 'apiDeleteTask';
    if(type === 'INVOICE') endpoint = 'apiDeleteInvoice';
    if(type === 'DOCUMENT') endpoint = 'apiDeleteDocument';

    if(endpoint) {
      callServer(endpoint, [id], function(res) {
        hideLoading();
        if(res.success) {
          showToast(res.data.message || 'Berhasil dihapus.', 'success');
          if(type === 'CLIENT') loadClients();
          if(type === 'ORG') loadOrganizations();
          if(type === 'MATTER') {
            if(state.currentView === 'matter-detail') navigateTo('matters');
            else loadMatters();
          }
          if(type === 'TASK') loadTasks();
          if(type === 'INVOICE') loadInvoices();
          if(type === 'DOCUMENT' && state.activeMatterId) loadMatterDetail(state.activeMatterId);
        } else {
          showToast(res.message, 'error');
        }
      });
    }
  }

    var data = {
      type: document.getElementById('edit-org-type').value,
      name: document.getElementById('edit-org-name').value,
      contactPerson: document.getElementById('edit-org-contact').value,
      phone: document.getElementById('edit-org-phone').value
    };
    closeModal('modal-edit-org');
    showLoading('Menyimpan...');
    callServer('apiUpdateOrganization', [id, data], function(res) {
      hideLoading();
      if(res.success) {
        showToast('Mitra diperbarui', 'success');
        loadOrganizations();
      } else {
        showToast(res.message, 'error');
      }
    });
  }

  function openEditMatterModal() {
    if(!state.activeMatterDetail) return;
    var m = state.activeMatterDetail.matter;
    document.getElementById('edit-matter-id').value = m.matterId;
    document.getElementById('edit-matter-title').value = m.title;
    document.getElementById('edit-matter-deadline').value = m.deadline ? m.deadline.substring(0,10) : '';
    document.getElementById('edit-matter-priority').value = m.priority || 'MEDIUM';
    
    populateStaffSelect('edit-matter-pic', m.assignedPIC);
    populateStaffSelect('edit-matter-spv', m.supervisor);
    
    openModal('modal-edit-matter');
  }

  function submitEditMatter(e) {
    e.preventDefault();
    var id = document.getElementById('edit-matter-id').value;
    var data = {
      title: document.getElementById('edit-matter-title').value,
      deadline: document.getElementById('edit-matter-deadline').value,
      priority: document.getElementById('edit-matter-priority').value,
      assignedPIC: document.getElementById('edit-matter-pic').value,
      supervisor: document.getElementById('edit-matter-spv').value
    };
    closeModal('modal-edit-matter');
    showLoading('Menyimpan...');
    callServer('apiUpdateMatter', [id, data], function(res) {
      hideLoading();
      if(res.success) {
        showToast('Detail perkara diperbarui', 'success');
        loadMatterDetail(id);
      } else {
        showToast(res.message, 'error');
      }
    });
  }

  function openUploadDocModal() {
    if(!state.activeMatterId) {
      showToast('Silakan buka satu perkara terlebih dahulu.', 'warning');
      return;
    }
    document.getElementById('upload-doc-matterId').value = state.activeMatterId;
    document.getElementById('upload-doc-title').value = '';
    document.getElementById('upload-doc-version').value = '';
    document.getElementById('upload-doc-url').value = '';
    openModal('modal-upload-doc');
  }

  function submitUploadDoc(e) {
    e.preventDefault();
    var data = {
      matterId: document.getElementById('upload-doc-matterId').value,
      documentType: document.getElementById('upload-doc-type').value,
      title: document.getElementById('upload-doc-title').value,
      version: document.getElementById('upload-doc-version').value,
      driveUrl: document.getElementById('upload-doc-url').value,
      status: document.getElementById('upload-doc-status').value
    };
    closeModal('modal-upload-doc');
    showLoading('Mencatat dokumen...');
    callServer('apiRegisterDocument', [data], function(res) {
      hideLoading();
      if(res.success) {
        showToast('Dokumen berhasil dicatat.', 'success');
        loadMatterDetail(data.matterId);
      } else {
        showToast(res.message, 'error');
      }
    });
  }

  function openUpdateDocStatusModal(docId, docTitle, status) {
    document.getElementById('update-doc-id').value = docId;
    document.getElementById('update-doc-title-label').innerText = docTitle;
    document.getElementById('update-doc-status-val').value = status;
    document.getElementById('update-doc-notes').value = '';
    openModal('modal-update-doc-status');
  }

  function submitUpdateDocStatus(e) {
    e.preventDefault();
    var id = document.getElementById('update-doc-id').value;
    var status = document.getElementById('update-doc-status-val').value;
    var notes = document.getElementById('update-doc-notes').value;
    closeModal('modal-update-doc-status');
    showLoading('Mengupdate status...');
    callServer('apiUpdateDocumentStatus', [id, status, notes], function(res) {
      hideLoading();
      if(res.success) {
        showToast('Status dokumen diperbarui', 'success');
        if(state.activeMatterId) loadMatterDetail(state.activeMatterId);
      } else {
        showToast(res.message, 'error');
      }
    });
  }

  return {

    confirmDelete: confirmDelete,
    executeDelete: executeDelete,
    submitResetDb: submitResetDb,
    openEditClientModal: openEditClientModal,
    submitEditClient: submitEditClient,
    openNewOrgModal: openModal.bind(null, 'modal-new-org'),
    submitNewOrg: submitNewOrg,
    openEditOrgModal: openEditOrgModal,
    submitEditOrg: submitEditOrg,
    openEditMatterModal: openEditMatterModal,
    submitEditMatter: submitEditMatter,
    openUploadDocModal: openUploadDocModal,
    submitUploadDoc: submitUploadDoc,
    openUpdateDocStatusModal: openUpdateDocStatusModal,
    submitUpdateDocStatus: submitUpdateDocStatus,
    printPdfPreview: printPdfPreview,
    confirmDeleteMatter: function() {
      if(state.activeMatterDetail) confirmDelete('MATTER', state.activeMatterDetail.matter.matterId, 'Hapus Perkara ini beserta Task dan Invoice-nya?');
    },

    state: state,
    init: init,
    submitLogin: submitLogin,
    logout: logout,
    navigateTo: navigateTo,
    refreshCurrentView: refreshCurrentView,
    toggleSidebar: toggleSidebar,
    openModal: openModal,
    closeModal: closeModal,
    showToast: showToast,
    onMattersFilterChange: onMattersFilterChange,
    submitNewMatter: submitNewMatter,
    openTransitionWorkflowModal: openTransitionWorkflowModal,
    submitTransitionWorkflow: submitTransitionWorkflow,
    openCancelMatterModal: openCancelMatterModal,
    submitCancelMatter: submitCancelMatter,
    restoreMatter: restoreMatter,
    openSetPendingModal: openSetPendingModal,
    submitSetPending: submitSetPending,
    resolvePending: resolvePending,
    openAddTaskModal: openAddTaskModal,
    submitAddTask: submitAddTask,
    quickCompleteTask: quickCompleteTask,
    openAddChecklistModal: openAddChecklistModal,
    submitAddChecklistItem: submitAddChecklistItem,
    openVerifyChecklistModal: openVerifyChecklistModal,
    submitVerifyChecklist: submitVerifyChecklist,
    generateDocRequestText: generateDocRequestText,
    submitNewClient: submitNewClient,
    submitNewIntake: submitNewIntake,
    convertIntake: convertIntake,
    openScheduleSigningModal: openScheduleSigningModal,
    submitScheduleSigning: submitScheduleSigning,
    openCreateInvoiceModal: openCreateInvoiceModal,
    submitCreateInvoice: submitCreateInvoice,
    openRecordPaymentModal: openRecordPaymentModal,
    submitRecordPayment: submitRecordPayment,
    openPdfPreview: openPdfPreview,
    printPreviewContent: printPreviewContent,
    saveOfficeProfile: saveOfficeProfile,
    runHealthCheck: runHealthCheck,
    createBackup: createBackup,
    seedDemoData: seedDemoData,
    submitNewUser: submitNewUser,
    deactivateUser: deactivateUser,
    openResetPasswordModal: openResetPasswordModal,
    submitResetPassword: submitResetPassword,
    openChangePasswordModal: openChangePasswordModal,
    submitChangePassword: submitChangePassword,
    submitStaffHandover: submitStaffHandover,
    onGlobalSearch: onGlobalSearch
  };
})();

document.addEventListener('DOMContentLoaded', function() {
  App.init();
});
</script>
