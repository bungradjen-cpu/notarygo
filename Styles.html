<style>
/* ==========================================================
   NOTARYGO™ — Notary Office Operational Control System
   Design System & Professional Legal Theme (CSS)
   ========================================================== */

@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap');

:root {
  --primary-navy: #0f172a;
  --primary-dark: #020617;
  --primary-surface: #1e293b;
  --sidebar-bg: #0b1120;
  --sidebar-hover: #1e293b;
  --sidebar-active: #1e293b;
  
  --accent-gold: #d97706;
  --accent-gold-hover: #b45309;
  --accent-gold-light: #fef3c7;
  
  --text-main: #0f172a;
  --text-muted: #64748b;
  --text-light: #94a3b8;
  --text-white: #ffffff;
  
  --bg-page: #f8fafc;
  --bg-card: #ffffff;
  --border-color: #e2e8f0;
  --border-focus: #94a3b8;
  
  --status-safe: #10b981;
  --status-safe-bg: #ecfdf5;
  --status-watch: #f59e0b;
  --status-watch-bg: #fffbeb;
  --status-warning: #f97316;
  --status-warning-bg: #fff7ed;
  --status-critical: #ef4444;
  --status-critical-bg: #fef2f2;
  --status-active: #3b82f6;
  --status-active-bg: #eff6ff;
  --status-archived: #64748b;
  --status-archived-bg: #f1f5f9;
  
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
  --shadow-modal: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.08);

  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  
  --transition-fast: 0.15s ease;
  --transition-normal: 0.25s ease;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background-color: var(--bg-page);
  color: var(--text-main);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

h1, h2, h3, h4, h5, h6, .brand-font {
  font-family: 'Outfit', sans-serif;
  font-weight: 700;
  color: var(--primary-navy);
}

/* Layout */
.app-container {
  display: flex;
  height: 100vh;
  width: 100vw;
  overflow: hidden;
}

/* Sidebar */
.app-sidebar {
  width: 260px;
  background-color: var(--sidebar-bg);
  color: var(--text-white);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  border-right: 1px solid rgba(255, 255, 255, 0.08);
  transition: transform var(--transition-normal);
  z-index: 50;
}

.sidebar-header {
  padding: 20px 18px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-badge {
  width: 38px;
  height: 38px;
  background: linear-gradient(135deg, var(--accent-gold), #b45309);
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Outfit', sans-serif;
  font-weight: 800;
  font-size: 18px;
  color: #ffffff;
  box-shadow: 0 2px 8px rgba(217, 119, 6, 0.4);
}

.brand-info h2 {
  font-size: 16px;
  color: #ffffff;
  letter-spacing: 0.5px;
  line-height: 1.2;
}

.brand-info p {
  font-size: 11px;
  color: var(--text-light);
  line-height: 1.2;
  margin-top: 2px;
}

.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: 14px 10px;
}

.nav-section-title {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: #64748b;
  padding: 12px 12px 6px 12px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 14px;
  color: #94a3b8;
  text-decoration: none;
  border-radius: var(--radius-md);
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 2px;
  cursor: pointer;
  transition: all var(--transition-fast);
}

.nav-item:hover {
  background-color: var(--sidebar-hover);
  color: #ffffff;
}

.nav-item.active {
  background-color: var(--primary-surface);
  color: #ffffff;
  font-weight: 600;
  border-left: 3px solid var(--accent-gold);
}

.nav-item svg {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
  opacity: 0.85;
}

.nav-item.active svg {
  opacity: 1;
  color: var(--accent-gold);
}

.nav-badge {
  margin-left: auto;
  background-color: var(--status-critical);
  color: #ffffff;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 20px;
}

.sidebar-footer {
  padding: 14px 16px;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  background-color: rgba(0, 0, 0, 0.2);
}

.user-profile-mini {
  display: flex;
  align-items: center;
  gap: 10px;
}

.user-avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--primary-surface);
  border: 1px solid rgba(255, 255, 255, 0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 13px;
  color: var(--accent-gold);
}

.user-details {
  flex: 1;
  min-width: 0;
}

.user-name {
  font-size: 12px;
  font-weight: 600;
  color: #ffffff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.user-role {
  font-size: 11px;
  color: var(--text-light);
  display: flex;
  align-items: center;
  gap: 4px;
}

/* Main Content Area */
.app-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  height: 100vh;
  overflow: hidden;
}

/* Top Navbar */
.app-navbar {
  height: 62px;
  background-color: var(--bg-card);
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  flex-shrink: 0;
  z-index: 40;
}

.navbar-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.mobile-menu-btn {
  display: none;
  background: none;
  border: none;
  color: var(--text-main);
  cursor: pointer;
  padding: 6px;
}

.office-tagline {
  font-size: 13px;
  color: var(--text-muted);
  font-weight: 500;
}

.office-tagline strong {
  color: var(--primary-navy);
}

.navbar-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.quick-search {
  position: relative;
  width: 280px;
}

.quick-search input {
  width: 100%;
  padding: 8px 12px 8px 34px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
  font-size: 13px;
  background-color: #f8fafc;
  outline: none;
  transition: all var(--transition-fast);
}

.quick-search input:focus {
  border-color: var(--accent-gold);
  background-color: #ffffff;
  box-shadow: 0 0 0 2px rgba(217, 119, 6, 0.15);
}

.quick-search svg {
  position: absolute;
  left: 10px;
  top: 9px;
  width: 16px;
  height: 16px;
  color: var(--text-light);
}

/* Content Body */
.app-content {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  background-color: var(--bg-page);
}

.view-container {
  display: none;
  max-width: 1320px;
  margin: 0 auto;
}

.view-container.active {
  display: block;
  animation: fadeIn 0.2s ease-in-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Page Header */
.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 12px;
}

.page-title h1 {
  font-size: 22px;
  letter-spacing: -0.3px;
  color: var(--primary-navy);
}

.page-title p {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 2px;
}

.page-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  border-radius: var(--radius-md);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all var(--transition-fast);
  text-decoration: none;
}

.btn-primary {
  background-color: var(--primary-navy);
  color: #ffffff;
}

.btn-primary:hover {
  background-color: var(--primary-dark);
}

.btn-gold {
  background-color: var(--accent-gold);
  color: #ffffff;
}

.btn-gold:hover {
  background-color: var(--accent-gold-hover);
}

.btn-secondary {
  background-color: #ffffff;
  border-color: var(--border-color);
  color: var(--text-main);
}

.btn-secondary:hover {
  background-color: #f1f5f9;
}

.btn-danger {
  background-color: var(--status-critical);
  color: #ffffff;
}

.btn-danger:hover {
  background-color: #dc2626;
}

.btn-sm {
  padding: 5px 10px;
  font-size: 12px;
}

/* KPI Card Grid */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.kpi-card {
  background-color: var(--bg-card);
  padding: 16px 18px;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-color);
  box-shadow: var(--shadow-sm);
  position: relative;
  overflow: hidden;
  transition: transform var(--transition-fast), box-shadow var(--transition-fast);
}

.kpi-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}

.kpi-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: var(--text-muted);
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.kpi-card-icon {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
}

.kpi-card-value {
  font-family: 'Outfit', sans-serif;
  font-size: 28px;
  font-weight: 800;
  color: var(--primary-navy);
  margin-top: 8px;
  line-height: 1.1;
}

.kpi-card-sub {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 6px;
}

.kpi-card.critical { border-left: 4px solid var(--status-critical); }
.kpi-card.critical .kpi-card-icon { background: var(--status-critical-bg); color: var(--status-critical); }
.kpi-card.warning { border-left: 4px solid var(--status-warning); }
.kpi-card.warning .kpi-card-icon { background: var(--status-warning-bg); color: var(--status-warning); }
.kpi-card.watch { border-left: 4px solid var(--status-watch); }
.kpi-card.watch .kpi-card-icon { background: var(--status-watch-bg); color: var(--status-watch); }
.kpi-card.safe { border-left: 4px solid var(--status-safe); }
.kpi-card.safe .kpi-card-icon { background: var(--status-safe-bg); color: var(--status-safe); }
.kpi-card.active { border-left: 4px solid var(--status-active); }
.kpi-card.active .kpi-card-icon { background: var(--status-active-bg); color: var(--status-active); }

/* Card & Panels */
.card {
  background-color: var(--bg-card);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-color);
  box-shadow: var(--shadow-sm);
  margin-bottom: 24px;
}

.card-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.card-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--primary-navy);
  display: flex;
  align-items: center;
  gap: 8px;
}

.card-body {
  padding: 20px;
}

/* Data Tables */
.table-responsive {
  width: 100%;
  overflow-x: auto;
}

.data-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: 13px;
}

.data-table th {
  background-color: #f8fafc;
  padding: 10px 14px;
  font-weight: 600;
  color: #475569;
  border-bottom: 1px solid var(--border-color);
  white-space: nowrap;
}

.data-table td {
  padding: 12px 14px;
  border-bottom: 1px solid #f1f5f9;
  color: var(--text-main);
  vertical-align: middle;
}

.data-table tr:hover td {
  background-color: #f8fafc;
}

/* Badges */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border-radius: var(--radius-sm);
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}

.badge-safe { background-color: var(--status-safe-bg); color: var(--status-safe); border: 1px solid rgba(16, 185, 129, 0.2); }
.badge-watch { background-color: var(--status-watch-bg); color: var(--status-watch); border: 1px solid rgba(245, 158, 11, 0.2); }
.badge-warning { background-color: var(--status-warning-bg); color: var(--status-warning); border: 1px solid rgba(249, 115, 22, 0.2); }
.badge-critical { background-color: var(--status-critical-bg); color: var(--status-critical); border: 1px solid rgba(239, 68, 68, 0.2); }
.badge-active { background-color: var(--status-active-bg); color: var(--status-active); border: 1px solid rgba(59, 130, 246, 0.2); }
.badge-archived { background-color: var(--status-archived-bg); color: var(--status-archived); border: 1px solid rgba(100, 116, 139, 0.2); }

/* Progress Bar */
.progress-bar-container {
  width: 100%;
  height: 8px;
  background-color: #e2e8f0;
  border-radius: 4px;
  overflow: hidden;
  margin-top: 4px;
}

.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--status-active), var(--status-safe));
  border-radius: 4px;
  transition: width 0.4s ease;
}

/* Forms */
.form-group {
  margin-bottom: 16px;
}

.form-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--primary-navy);
  margin-bottom: 6px;
}

.form-label.required::after {
  content: " *";
  color: var(--status-critical);
}

.form-control {
  width: 100%;
  padding: 8px 12px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
  font-size: 13px;
  outline: none;
  font-family: inherit;
  transition: all var(--transition-fast);
}

.form-control:focus {
  border-color: var(--accent-gold);
  box-shadow: 0 0 0 2px rgba(217, 119, 6, 0.15);
}

textarea.form-control {
  min-height: 80px;
  resize: vertical;
}

.form-row {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
}

.form-col {
  flex: 1;
  min-width: 200px;
}

/* Modals */
.modal-backdrop {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-color: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(2px);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-backdrop.active {
  display: flex;
  animation: fadeIn 0.15s ease-out;
}

.modal-dialog {
  background-color: #ffffff;
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-modal);
  width: 100%;
  max-width: 600px;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.modal-dialog.lg {
  max-width: 850px;
}

.modal-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.modal-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--primary-navy);
}

.modal-close {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text-light);
  font-size: 20px;
  line-height: 1;
}

.modal-close:hover {
  color: var(--text-main);
}

.modal-body {
  padding: 20px;
  overflow-y: auto;
  flex: 1;
}

.modal-footer {
  padding: 14px 20px;
  border-top: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
  background-color: #f8fafc;
}

/* Toast Notifications */
.toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 200;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.toast {
  background-color: #ffffff;
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg);
  border-left: 4px solid var(--primary-navy);
  padding: 12px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 280px;
  max-width: 400px;
  animation: slideIn 0.25s ease-out;
}

.toast.success { border-left-color: var(--status-safe); }
.toast.error { border-left-color: var(--status-critical); }
.toast.warning { border-left-color: var(--status-warning); }

@keyframes slideIn {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

/* Loading Overlay */
.loading-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-color: rgba(255, 255, 255, 0.7);
  z-index: 300;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 12px;
}

.loading-overlay.active {
  display: flex;
}

.spinner {
  width: 36px;
  height: 36px;
  border: 3px solid #e2e8f0;
  border-top: 3px solid var(--accent-gold);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* Login View Styles */
.login-view-container {
  display: flex;
  min-height: 100vh;
  width: 100vw;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at top right, #1e293b, #0f172a, #020617);
  padding: 24px;
  position: fixed;
  top: 0;
  left: 0;
  z-index: 10000;
}

.login-card {
  width: 100%;
  max-width: 440px;
  background: rgba(30, 41, 59, 0.7);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: var(--radius-xl);
  padding: 40px 32px;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
  color: var(--text-white);
  animation: fadeIn 0.4s ease;
}

.login-brand-header {
  text-align: center;
  margin-bottom: 28px;
}

.login-brand-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 56px;
  height: 56px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--accent-gold), #b45309);
  color: #ffffff;
  font-family: 'Outfit', sans-serif;
  font-weight: 800;
  font-size: 22px;
  box-shadow: 0 8px 16px rgba(217, 119, 6, 0.35);
  margin-bottom: 14px;
}

.login-title {
  font-size: 24px;
  color: #ffffff;
  margin-bottom: 4px;
  letter-spacing: -0.5px;
}

.login-subtitle {
  font-size: 13px;
  color: var(--text-light);
}

.login-form .form-group {
  margin-bottom: 18px;
}

.login-form .form-label {
  color: #cbd5e1;
  font-weight: 500;
  font-size: 13px;
}

.login-form .form-control {
  background: rgba(15, 23, 42, 0.8);
  border: 1px solid #334155;
  color: #ffffff;
  padding: 12px 14px;
  font-size: 14px;
  border-radius: var(--radius-md);
}

.login-form .form-control:focus {
  border-color: var(--accent-gold);
  box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.2);
}

.login-btn {
  width: 100%;
  padding: 13px;
  font-size: 15px;
  font-weight: 600;
  border-radius: var(--radius-md);
  margin-top: 8px;
  background: linear-gradient(135deg, var(--accent-gold), #b45309);
  border: none;
  color: #ffffff;
  cursor: pointer;
  transition: all var(--transition-fast);
  box-shadow: 0 4px 12px rgba(217, 119, 6, 0.3);
}

.login-btn:hover {
  filter: brightness(1.1);
  transform: translateY(-1px);
}

.login-footer-info {
  margin-top: 24px;
  text-align: center;
  font-size: 12px;
  color: var(--text-light);
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  padding-top: 16px;
