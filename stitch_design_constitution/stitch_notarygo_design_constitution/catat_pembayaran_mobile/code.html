            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="bg-background text-on-background font-body-base antialiased md:hidden h-screen flex flex-col">
<!-- Header (Transactional) -->
<header class="bg-surface sticky top-0 z-40 border-b border-border-subtle h-touch-target-min flex items-center px-gutter justify-between">
<div class="flex items-center gap-stack-sm text-primary">
<span class="material-symbols-outlined cursor-pointer" onclick="window.history.back()">arrow_back</span>
<h1 class="text-title-md font-title-md">Record Payment</h1>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto px-gutter py-container-padding pb-32">
<!-- Outstanding Summary Card -->
<div class="bg-surface-card rounded-lg border border-border-subtle p-gutter shadow-[0_4px_12px_rgba(0,0,0,0.03)] mb-container-padding flex flex-col gap-stack-sm items-center text-center">
<span class="text-label-caps font-label-caps text-on-surface-variant">CURRENT OUTSTANDING</span>
<div class="text-stats-number font-stats-number text-primary">Rp 45,000,000</div>
<div class="inline-flex items-center gap-1 bg-error-container text-on-error-container px-2 py-1 rounded-full text-label-caps font-label-caps mt-2">
<span class="material-symbols-outlined text-[14px]">warning</span>
                Overdue
            </div>
</div>
<!-- Payment Form -->
<form class="flex flex-col gap-gutter">
<!-- Amount Input -->
<div class="flex flex-col gap-1">
<label class="text-body-sm font-body-sm text-on-surface-variant" for="amount">Amount (Rp)</label>
<input class="h-touch-target-min w-full rounded border-outline-variant focus:border-primary focus:ring-primary text-body-base bg-surface-container-lowest" id="amount" placeholder="e.g. 10000000" required="" type="number"/>
</div>
<!-- Payment Date Input -->
<div class="flex flex-col gap-1">
<label class="text-body-sm font-body-sm text-on-surface-variant" for="date">Payment Date</label>
<div class="relative">
<input class="h-touch-target-min w-full rounded border-outline-variant focus:border-primary focus:ring-primary text-body-base bg-surface-container-lowest pl-10" id="date" required="" type="date"/>
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">calendar_today</span>
</div>
</div>
<!-- Payment Method Select -->
<div class="flex flex-col gap-1">
<label class="text-body-sm font-body-sm text-on-surface-variant" for="method">Method</label>
<div class="relative">
<select class="h-touch-target-min w-full rounded border-outline-variant focus:border-primary focus:ring-primary text-body-base bg-surface-container-lowest appearance-none pl-10 pr-10" id="method" required="">
<option disabled="" selected="" value="">Select method</option>
<option value="bank_transfer">Bank Transfer</option>
<option value="cash">Cash</option>
<option value="cheque">Cheque</option>
</select>
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">account_balance</span>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<!-- Notes Textarea -->
<div class="flex flex-col gap-1">
<label class="text-body-sm font-body-sm text-on-surface-variant" for="notes">Notes (Optional)</label>
<textarea class="w-full rounded border-outline-variant focus:border-primary focus:ring-primary text-body-base bg-surface-container-lowest p-3" id="notes" placeholder="Add any references or details..." rows="3"></textarea>
</div>
</form>
</main>
<!-- Sticky Bottom CTA -->
<div class="fixed bottom-0 left-0 right-0 p-gutter bg-surface-card border-t border-border-subtle shadow-[0_-4px_12px_rgba(0,0,0,0.05)] z-50">
<button class="w-full h-touch-target-min bg-primary text-on-primary rounded font-title-md text-title-md flex items-center justify-center gap-stack-sm hover:opacity-90 active:scale-[0.98] transition-all" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
            Simpan Pembayaran
        </button>
</div>
</body></html>
