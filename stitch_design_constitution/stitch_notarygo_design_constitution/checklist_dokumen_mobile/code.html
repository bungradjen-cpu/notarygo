<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Document Checklist</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed-variant": "#36485b",
                        "secondary": "#944a00",
                        "surface-card": "#FFFFFF",
                        "surface-container-high": "#e7e8e9",
                        "surface-container": "#edeeef",
                        "primary-fixed-dim": "#afc8f0",
                        "on-secondary-fixed": "#301400",
                        "outline-variant": "#c4c6cf",
                        "primary": "#000613",
                        "inverse-on-surface": "#f0f1f2",
                        "status-critical": "#E74C3C",
                        "surface-dim": "#d9dadb",
                        "secondary-fixed": "#ffdcc5",
                        "error-container": "#ffdad6",
                        "tertiary-container": "#0d2031",
                        "surface-container-highest": "#e1e3e4",
                        "inverse-primary": "#afc8f0",
                        "on-tertiary-fixed": "#091d2e",
                        "on-primary": "#ffffff",
                        "on-background": "#191c1d",
                        "on-error": "#ffffff",
                        "surface-tint": "#476083",
                        "surface-container-low": "#f3f4f5",
                        "border-subtle": "#E2E8F0",
                        "tertiary": "#000610",
                        "status-archived": "#94A3B8",
                        "surface-bright": "#f8f9fa",
                        "inverse-surface": "#2e3132",
                        "background": "#f8f9fa",
                        "on-secondary-container": "#663100",
                        "primary-fixed": "#d4e3ff",
                        "status-warning-medium": "#E67E22",
                        "status-success": "#10B981",
                        "on-primary-fixed": "#001c3a",
                        "on-tertiary": "#ffffff",
                        "surface": "#f8f9fa",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed-dim": "#b5c8df",
                        "surface-variant": "#e1e3e4",
                        "outline": "#74777f",
                        "on-surface-variant": "#43474e",
                        "on-error-container": "#93000a",
                        "status-active": "#3498DB",
                        "tertiary-fixed": "#d1e4fb",
                        "on-tertiary-container": "#76889d",
                        "on-surface": "#191c1d",
                        "on-primary-container": "#6f88ad",
                        "secondary-container": "#fc8f34",
                        "on-primary-fixed-variant": "#2f486a",
                        "primary-container": "#001f3f",
                        "on-secondary-fixed-variant": "#713700",
                        "error": "#ba1a1a",
                        "secondary-fixed-dim": "#ffb783",
                        "status-warning-low": "#F1C40F",
                        "on-secondary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sidebar-width": "260px",
                        "touch-target-min": "44px",
                        "stack-sm": "0.5rem",
                        "container-padding": "2rem",
                        "gutter": "1.5rem",
                        "stack-md": "1rem"
                    },
                    "fontFamily": {
                        "body-sm": ["Inter"],
                        "body-base": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-caps": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "title-md": ["Inter"],
                        "stats-number": ["Inter"]
                    },
                    "fontSize": {
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-base": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "title-md": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "stats-number": ["28px", { "lineHeight": "34px", "fontWeight": "700" }]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-base min-h-screen md:hidden">
<!-- Top Navigation Bar -->
<header class="flex justify-between items-center px-gutter h-touch-target-min w-full sticky top-0 z-40 border-b border-border-subtle bg-surface">
<div class="flex items-center gap-stack-sm text-primary font-bold">
<span class="material-symbols-outlined cursor-pointer" data-icon="arrow_back">arrow_back</span>
<span class="text-title-md font-title-md text-primary-container">Documents</span>
</div>
<div class="flex items-center gap-stack-md text-on-surface-variant">
<span class="material-symbols-outlined cursor-pointer" data-icon="more_vert">more_vert</span>
</div>
</header>
<main class="px-gutter py-container-padding flex flex-col gap-stack-md">
<!-- Progress Header -->
<section class="bg-surface-card rounded-lg border border-border-subtle p-gutter shadow-[0px_4px_12px_rgba(0,0,0,0.03)]">
<div class="flex justify-between items-center mb-stack-sm">
<h2 class="text-title-md font-title-md text-on-surface">Checklist Progress</h2>
<span class="text-label-caps font-label-caps text-on-surface-variant">8/10</span>
</div>
<div class="w-full bg-surface-container-highest rounded-full h-2.5">
<div class="bg-primary h-2.5 rounded-full" style="width: 80%"></div>
</div>
<p class="text-body-sm font-body-sm text-on-surface-variant mt-stack-sm">80% of required documents collected.</p>
</section>
<!-- Document List -->
<section class="flex flex-col gap-stack-sm">
<!-- Document Item: Verified -->
<div class="bg-surface-card rounded-lg border border-border-subtle p-stack-md flex flex-col gap-stack-sm shadow-[0px_4px_12px_rgba(0,0,0,0.03)]">
<div class="flex justify-between items-start">
<div>
<h3 class="text-body-base font-body-base font-semibold text-on-surface">KTP</h3>
<p class="text-body-sm font-body-sm text-on-surface-variant">Kartu Tanda Penduduk</p>
</div>
<!-- Status Badge -->
<div class="flex items-center gap-1 bg-status-success/10 text-status-success px-2 py-1 rounded">
<span class="material-symbols-outlined text-[16px]" data-icon="check_circle" data-weight="fill">check_circle</span>
<span class="text-label-caps font-label-caps">Verified</span>
</div>
</div>
<div class="text-body-sm font-body-sm text-on-surface-variant mt-2 flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]" data-icon="description">description</span>
                    ktp_scan_john_doe.pdf
                </div>
</div>
<!-- Document Item: Missing -->
<div class="bg-surface-card rounded-lg border border-status-critical/30 p-stack-md flex flex-col gap-stack-sm shadow-[0px_4px_12px_rgba(0,0,0,0.03)]">
<div class="flex justify-between items-start">
<div>
<h3 class="text-body-base font-body-base font-semibold text-on-surface">NPWP</h3>
<p class="text-body-sm font-body-sm text-on-surface-variant">Nomor Pokok Wajib Pajak</p>
</div>
<!-- Status Badge -->
<div class="flex items-center gap-1 bg-status-critical/10 text-status-critical px-2 py-1 rounded">
<span class="material-symbols-outlined text-[16px]" data-icon="error" data-weight="fill">error</span>
<span class="text-label-caps font-label-caps">Missing</span>
</div>
</div>
<!-- Action Buttons (Large & Touch-friendly) -->
<div class="grid grid-cols-2 gap-stack-sm mt-stack-sm">
<button class="h-touch-target-min flex justify-center items-center gap-2 bg-primary text-on-primary rounded border border-primary hover:bg-primary/90 transition-colors">
<span class="material-symbols-outlined" data-icon="upload">upload</span>
<span class="font-body-sm font-semibold">Upload</span>
</button>
<button class="h-touch-target-min flex justify-center items-center gap-2 bg-surface-card text-primary rounded border border-primary hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined" data-icon="forward_to_inbox">forward_to_inbox</span>
<span class="font-body-sm font-semibold">Request</span>
</button>
</div>
</div>
<!-- Document Item: Pending Review -->
<div class="bg-surface-card rounded-lg border border-status-warning-medium/30 p-stack-md flex flex-col gap-stack-sm shadow-[0px_4px_12px_rgba(0,0,0,0.03)]">
<div class="flex justify-between items-start">
<div>
<h3 class="text-body-base font-body-base font-semibold text-on-surface">KK</h3>
<p class="text-body-sm font-body-sm text-on-surface-variant">Kartu Keluarga</p>
</div>
<!-- Status Badge -->
<div class="flex items-center gap-1 bg-status-warning-medium/10 text-status-warning-medium px-2 py-1 rounded">
<span class="material-symbols-outlined text-[16px]" data-icon="pending" data-weight="fill">pending</span>
<span class="text-label-caps font-label-caps">Review</span>
</div>
</div>
<div class="text-body-sm font-body-sm text-on-surface-variant mt-2 flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]" data-icon="image">image</span>
                    kk_photo_v2.jpg
                </div>
</div>
</section>
</main>
</body></html>
