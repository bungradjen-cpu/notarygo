<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mobile Settings &amp; Office Profile</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",

                extend: {
                    "colors": {
                        "on-tertiary-fixed-variant": "#36485b",
                        "secondary": "#944a00",
                        "surface-card": "#FFFFFF",
                        "surface-container-high": "#e7e8e9",
                        "surface-container": "#edeeef",
                        "primary-fixed-dim": "#afc8f0",
                        "on-secondary-fixed": "#301400",
                        "outline-variant": "#c4c6cf",
                        "primary": "#000613",
                        "inverse-on-surface": "#f0f1f2",
                        "status-critical": "#E74C3C",
                        "surface-dim": "#d9dadb",
                        "secondary-fixed": "#ffdcc5",
                        "error-container": "#ffdad6",
                        "tertiary-container": "#0d2031",
                        "surface-container-highest": "#e1e3e4",
                        "inverse-primary": "#afc8f0",
                        "on-tertiary-fixed": "#091d2e",
                        "on-primary": "#ffffff",
                        "on-background": "#191c1d",
                        "on-error": "#ffffff",
                        "surface-tint": "#476083",
                        "surface-container-low": "#f3f4f5",
                        "border-subtle": "#E2E8F0",
                        "tertiary": "#000610",
                        "status-archived": "#94A3B8",
                        "surface-bright": "#f8f9fa",
                        "inverse-surface": "#2e3132",
                        "background": "#f8f9fa",
                        "on-secondary-container": "#663100",
                        "primary-fixed": "#d4e3ff",
                        "status-warning-medium": "#E67E22",
                        "status-success": "#10B981",
                        "on-primary-fixed": "#001c3a",
                        "on-tertiary": "#ffffff",
                        "surface": "#f8f9fa",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed-dim": "#b5c8df",
                        "surface-variant": "#e1e3e4",
                        "outline": "#74777f",
                        "on-surface-variant": "#43474e",
                        "on-error-container": "#93000a",
                        "status-active": "#3498DB",
                        "tertiary-fixed": "#d1e4fb",
                        "on-tertiary-container": "#76889d",
                        "on-surface": "#191c1d",

                        "error": "#ba1a1a",
                        "secondary-fixed-dim": "#ffb783",
                        "status-warning-low": "#F1C40F",
                        "on-secondary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sidebar-width": "260px",
                        "touch-target-min": "44px",
                        "stack-sm": "0.5rem",
                        "container-padding": "2rem",
                        "gutter": "1.5rem",
                        "stack-md": "1rem"
                    },
                    "fontFamily": {
                        "body-sm": ["Inter"],
                        "body-base": ["Inter"],
                        "display-lg": ["Inter"],

                        "title-md": ["Inter"],
                        "stats-number": ["Inter"]
                    },
                    "fontSize": {
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-base": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "title-md": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "stats-number": ["28px", { "lineHeight": "34px", "fontWeight": "700" }]

                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
        body {
            background-color: #f8f9fa; /* bg-background */
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-base antialiased md:hidden flex flex-col min-h-screen">
<!-- Top Navigation (Mobile App Header) -->
<header class="bg-surface docked h-touch-target-min w-full sticky top-0 z-40 border-b border-border-subtle flex justify-between items-center px-gutter">
<div class="flex items-center gap-2">
<button class="w-touch-target-min h-touch-target-min flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="text-title-md font-title-md font-bold text-primary">Settings</h1>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col">
<!-- Settings Navigation List -->
<div class="flex flex-col bg-surface-card border-b border-border-subtle shadow-sm mb-4">
<!-- Identitas Kantor (Active) -->
<a class="flex items-center justify-between px-gutter py-4 border-l-4 border-primary bg-on-primary-container/10" href="#">
<div class="flex items-center gap-stack-md">
<span class="material-symbols-outlined text-primary fill">store</span>
<span class="text-body-base font-body-base font-semibold text-primary">Identitas Kantor</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</a>
<div class="h-px bg-border-subtle ml-12"></div>
<!-- Logo & Branding -->
<a class="flex items-center justify-between px-gutter py-4 text-on-surface-variant hover:bg-surface-container-lowest transition-colors" href="#">
<div class="flex items-center gap-stack-md">
<span class="material-symbols-outlined">palette</span>
<span class="text-body-base font-body-base">Logo &amp; Branding</span>
</div>
<span class="material-symbols-outlined">chevron_right</span>
</a>
<div class="h-px bg-border-subtle ml-12"></div>
<!-- Payment Info -->
<a class="flex items-center justify-between px-gutter py-4 text-on-surface-variant hover:bg-surface-container-lowest transition-colors" href="#">
<div class="flex items-center gap-stack-md">
<span class="material-symbols-outlined">payments</span>
<span class="text-body-base font-body-base">Payment Info</span>
</div>
<span class="material-symbols-outlined">chevron_right</span>
</a>
<div class="h-px bg-border-subtle ml-12"></div>
<!-- User Management -->
<a class="flex items-center justify-between px-gutter py-4 text-on-surface-variant hover:bg-surface-container-lowest transition-colors" href="#">
<div class="flex items-center gap-stack-md">
<span class="material-symbols-outlined">group</span>
<span class="text-body-base font-body-base">User Management</span>
</div>
<span class="material-symbols-outlined">chevron_right</span>
</a>
<div class="h-px bg-border-subtle ml-12"></div>
<!-- Subscription -->
<a class="flex items-center justify-between px-gutter py-4 text-on-surface-variant hover:bg-surface-container-lowest transition-colors" href="#">
<div class="flex items-center gap-stack-md">
<span class="material-symbols-outlined">card_membership</span>
<span class="text-body-base font-body-base">Subscription</span>
</div>
<span class="material-symbols-outlined">chevron_right</span>
</a>
</div>
<!-- Single Column Form (Identitas Kantor View) -->
<div class="px-gutter pb-8 flex-1">
<h2 class="text-headline-lg-mobile font-headline-lg-mobile text-primary mb-6">Office Details</h2>
<form class="flex flex-col gap-6">
<!-- Office Name -->
<div class="flex flex-col gap-1">
<label class="text-label-caps font-label-caps text-on-surface-variant uppercase" for="office_name">Office Name</label>
<input class="h-touch-target-min w-full rounded border border-outline-variant bg-surface-card px-4 text-body-base focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow" id="office_name" type="text" value="Kantor Notaris &amp; PPAT Nama Notaris, S.H., M.Kn."/>
</div>
<!-- Email -->
<div class="flex flex-col gap-1">
<label class="text-label-caps font-label-caps text-on-surface-variant uppercase" for="office_email">Primary Email</label>
<input class="h-touch-target-min w-full rounded border border-outline-variant bg-surface-card px-4 text-body-base focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow" id="office_email" type="email" value="contact@notaris.co.id"/>
</div>
<!-- Phone -->
<div class="flex flex-col gap-1">
<label class="text-label-caps font-label-caps text-on-surface-variant uppercase" for="office_phone">Phone Number</label>
<input class="h-touch-target-min w-full rounded border border-outline-variant bg-surface-card px-4 text-body-base focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow" id="office_phone" type="tel" value="+62 21 555 0123"/>
</div>
<!-- Address -->
<div class="flex flex-col gap-1">
<label class="text-label-caps font-label-caps text-on-surface-variant uppercase" for="office_address">Office Address</label>
<textarea class="w-full rounded border border-outline-variant bg-surface-card p-4 text-body-base focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow resize-none" id="office_address" rows="3">Jl. Sudirman Kav 1, Jakarta Selatan, 12190</textarea>
</div>
<!-- Save Action -->
<button class="mt-4 h-touch-target-min w-full bg-primary text-on-primary rounded font-title-md text-title-md flex items-center justify-center hover:bg-primary/90 transition-colors" type="button">
                    Save Changes
                </button>
</form>
</div>
</main>
</body></html>
